- id: ADR-001
  title: Provider-independent code review runtime
  status: adopted
  date: 2026-09-16
  stacks: [review, mcp]
  context: |
    MAFIA Code-Review Harness의 핵심 흐름은 설계의도, 평가기준, 근거 기반 리뷰, 리뷰 반영, QA로 구성되어 있지만 원본 구현은 Claude Code의 plugin, Fork(worktree), Sub-agent에 의존한다. Project Moon은 ChatGPT를 포함한 여러 MCP 클라이언트에서 동일한 원격 개발 런타임을 제공하므로 특정 모델 CLI가 설치되지 않아도 동일한 검토 절차와 증거를 유지해야 한다.
  decision: 리뷰 상태·Git 고정·worktree·산출물·QA는 Project Moon이 담당하고, 추론과 리뷰 문장 생성은 연결된 MCP 클라이언트 또는 향후 provider adapter가 담당한다.
  consequence: 현재 ChatGPT만으로 리뷰 파이프라인을 사용할 수 있으며 향후 Codex/Claude 어댑터를 추가해도 리뷰 저장 형식과 게이트는 유지된다.

- id: ADR-002
  title: Immutable pinned review input
  status: adopted
  date: 2026-09-16
  stacks: [review, git]
  context: |
    리뷰 시작 후 브랜치가 이동하거나 작업 트리에 미커밋 변경이 존재하면 모델이 실제 push될 코드와 다른 입력을 검토했다고 잘못 판단할 수 있다. 특히 자동 수정 과정에서 검토 대상 SHA와 수정 결과를 혼동하면 QA 통과만으로 리뷰 완료를 선언하는 문제가 생긴다.
  decision: review_start는 clean working tree만 허용하고 base/head/merge-base SHA를 manifest에 고정한다. HEAD가 이동하면 STALE로 표시한다. writable worktree가 고정 SHA에서 변경되면 fixesPending으로 간주하고 새 커밋에 대한 재리뷰 없이는 push-ready를 허용하지 않는다.
  consequence: 수정 후에는 새 커밋을 만들고 새로운 review run을 시작해야 하며, 대신 어떤 코드가 어떤 기준으로 검토됐는지 재현 가능하다.

- id: ADR-003
  title: Local review evidence stays outside normal Git changes
  status: adopted
  date: 2026-09-16
  stacks: [review, git]
  context: |
    design-intent, review-comments, QA 로그 같은 실행별 증거를 대상 feature diff에 자동 포함하면 리뷰 시스템 자체가 검토 대상 변경을 오염시키고 지속적으로 dirty working tree를 만든다.
  decision: 실행별 산출물은 대상 저장소의 .moon/reviews 아래에 저장하되 해당 저장소의 local .git/info/exclude에 .moon/을 등록한다. 프로젝트가 명시적으로 산출물을 버전 관리하려는 경우에만 별도 정책으로 승격한다.
  consequence: 리뷰 증거는 호스트에 유지되면서 일반 feature diff에는 포함되지 않는다. 장기 중앙 보관은 후속 artifact store 기능으로 확장한다.

- id: ADR-004
  title: Stable public MCP ingress uses Tailscale Funnel
  status: adopted
  date: 2026-09-16
  stacks: [network, oauth, deployment]
  context: |
    임시 공개 터널 주소가 재시작마다 바뀌면 MCP 공개 URL과 OAuth issuer/resource가 어긋나 연결이 깨질 수 있다. 공개 주소를 코드나 수동 설정에 고정하면 실제 런타임 주소와 다시 불일치할 위험도 있다.
  decision: Windows 공개 실행 경로는 Tailscale Funnel을 사용하고 Start-PublicMcp.ps1이 Funnel이 반환한 실제 *.ts.net HTTPS URL을 먼저 확인한 뒤 동일 URL로 OAuth public URL, issuer, resource를 구성한다.
  consequence: 공개 주소와 OAuth identity가 같은 런타임 사실에서 파생된다. 과거 Quick Tunnel/Named Tunnel 구현 계획은 런타임 스펙으로 취급하지 않는다.

- id: ADR-005
  title: AI task policy is pinned and validated programmatically
  status: adopted
  date: 2026-09-16
  stacks: [task, harness, validation]
  context: |
    에이전트가 구현 중 검증 설정이나 아키텍처 규칙을 약화할 수 있다면 동일 작업에서 자신의 품질 게이트를 우회할 수 있다. 또한 검증 이후 코드가 변경되면 이전 QA 결과는 현재 코드의 증거가 아니다.
  decision: task_start 시점의 하니스 정책을 .moon 작업 산출물에 SHA-256과 함께 고정한다. 위험도 판정과 task_validate의 검증 명령은 고정 정책을 사용하고, 검증한 Git/working-tree fingerprint가 달라지면 완료 상태를 STALE로 처리한다.
  consequence: 작업 도중 moon.config.json이 바뀌어도 진행 중인 task run의 기준은 약화되지 않는다. 정책 변경을 적용하려면 새 task run을 시작해야 하며, 검증 이후 변경에는 재검증이 필요하다.

- id: ADR-006
  title: Single public MCP with isolated merge-auditor backend
  status: adopted
  date: 2026-09-18
  stacks: [merge-audit, mcp, security, deployment]
  context: |
    Merge Auditor를 별도 공개 MCP/ChatGPT 앱으로 노출하면 개발과 검수의 권한 분리는 명확하지만 사용자가 두 커넥터를 관리해야 하고 에이전트가 작업 중 도구 표면을 전환해야 한다. 반대로 개발 런타임에 검수 GitHub 자격증명을 직접 넣으면 독립 검수의 보안 경계가 무너진다.
  decision: Project Moon은 기존 HTTPS 443 공개 MCP 하나만 유지하고, 개발 런타임이 allowlist된 merge_audit_* 호출만 private Docker network의 별도 merge-auditor 런타임으로 프록시한다. 검수 런타임은 shared workspace를 read-only로 보고 전용 Docker volume의 별도 GitHub CLI 계정을 사용한다. 최종 merge는 감사 SHA, 검수계정 본인의 APPROVED 리뷰, CI 성공, CLEAN merge state를 기계적으로 재검증한 뒤 --match-head-commit으로만 수행한다.
  consequence: ChatGPT에서는 Moon 하나만 연결하면 개발·독립 검수·merge를 사용할 수 있지만 개발 런타임은 검수계정 GitHub credential을 보유하지 않는다. 별도 8443 공개 Funnel은 필요하지 않으며 내부 service Bearer가 Developer→Auditor RPC 경계를 보호한다.

- id: ADR-007
  title: Merge approval requires full independent review evidence
  status: adopted
  date: 2026-09-18
  stacks: [merge-audit, review, validation, security]
  context: |
    A SHA-safe merge executor prevents stale or unauthorized merges but does not by itself establish that the code is correct, maintainable, requirement-complete, or adequately tested. Running untrusted repository code inside the credential-bearing Merge Auditor would also weaken the GitHub credential boundary.
  decision: |
    The Merge Auditor performs a read-only full final review over requirements, correctness, code quality, tests, regression, architecture, API contracts, security, performance, operations, and maintainability. It may inspect unchanged related repository content only through bounded git show/git grep queries pinned to the exact audited head SHA, without arbitrary filesystem-read authority. It persists structured P1-P4 findings, category coverage, risk-derived validation requirements, and validation evidence bound to the exact head SHA. Approval is bound to repository, PR, base SHA, and head SHA; movement of either base or head invalidates it. Repository code is not executed inside the auditor runtime; deterministic execution remains in developer/CI environments and the mechanical GitHub gate rechecks live CI before merge.
  consequence: |
    MERGE_APPROVED now represents a full independent quality decision rather than only a safe-to-execute merge decision. The client must provide traceable validation evidence, and a new audit is required whenever the PR base or head changes.

- id: ADR-008
  title: Merge validation evidence must be backend-verified
  status: adopted
  date: 2026-09-18
  stacks: [merge-audit, validation, task, security]
  context: |
    Merge Auditor가 validationEvidence의 source, profile, passed, headSha, reference를 호출자 입력만으로 신뢰하면 에이전트의 실수나 과장된 자기보고가 품질 게이트를 통과할 수 있다. 반대로 credential을 가진 auditor 런타임에서 대상 코드를 직접 실행하면 보안 경계가 약해진다.
  decision: |
    MERGE_APPROVED에 필요한 검증 증거는 backend resolver가 실제 증거를 재확인한 경우에만 인정한다. 현재 source=moon_task는 .moon/tasks의 실제 task manifest를 조회하고 VERIFIED/COMPLETE 상태, 실제 validation profile/pass 상태, audited HEAD 일치, 현재 repository fingerprint와 저장된 validation fingerprint 일치를 모두 확인한다. github_ci, external_ci, moon_review는 provider-backed resolver가 추가되기 전까지 보조 증거로만 저장하고 승인 프로필 충족에는 사용하지 않는다. verified-evidence 계약 이전의 merge-audit schema v1/v2 run은 재사용하지 않는다.
  consequence: |
    단순 문자열 자기보고로는 merge 승인을 얻을 수 없고, 검증 이후 작업 트리나 HEAD가 바뀌면 task evidence가 자동으로 stale 처리된다. 향후 GitHub/외부 CI provider resolver를 추가할 때 동일한 verified evidence 인터페이스를 확장한다.
