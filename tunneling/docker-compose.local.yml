services:
  workmachine:
    build:
      context: .
      args:
        TIMEZONE: "${TZ:-Asia/Seoul}"
        COKACREMOTE_REF: "${COKACREMOTE_REF:-main}"
        COKACREMOTE_REVISION: "${COKACREMOTE_REVISION:-}"
    image: "${WORKMACHINE_IMAGE:-cokacremote-local:0.1.0}"
    container_name: cokacremote-local
    hostname: cokacremote-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:2999:2999"
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      MCP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      MCP_OAUTH_ISSUER: "${MCP_PUBLIC_URL:-}"
      MCP_OAUTH_RESOURCE: "${MCP_PUBLIC_URL:-}${MCP_ENDPOINT:-/mcp}"
      MCP_ALLOW_NO_AUTH: "${MCP_ALLOW_NO_AUTH:-true}"
      MCP_OAUTH_ENABLED: "${MCP_OAUTH_ENABLED:-false}"
      MCP_AUTH_TOKEN: ""
      MCP_DEFAULT_CWD: "/shared"
    volumes:
      - type: bind
        source: ../shared
        target: /shared
      - type: volume
        source: cokacremote-local-state
        target: /var/lib/cokacremote
    stop_grace_period: 30s

  cloudflared:
    image: "cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4"
    container_name: cokacremote-cloudflared
    restart: unless-stopped
    depends_on:
      workmachine:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://workmachine:2999
      - --http-host-header
      - localhost

volumes:
  cokacremote-local-state:
