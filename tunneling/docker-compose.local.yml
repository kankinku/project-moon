services:
  workmachine:
    build:
      context: ..
      dockerfile: tunneling/Dockerfile
      args:
        TIMEZONE: "${TZ:-Asia/Seoul}"
    image: "${WORKMACHINE_IMAGE:-project-moon-local:0.1.0}"
    container_name: project-moon-local
    hostname: project-moon-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:2999:2999"
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      MCP_WORKFLOW_MODE: "${MCP_WORKFLOW_MODE:-auto}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      MCP_OAUTH_ISSUER: "${MCP_PUBLIC_URL:-}"
      MCP_OAUTH_RESOURCE: "${MCP_PUBLIC_URL:-}${MCP_ENDPOINT:-/mcp}"
      MCP_ALLOW_NO_AUTH: "${MCP_ALLOW_NO_AUTH:-true}"
      MCP_OAUTH_ENABLED: "${MCP_OAUTH_ENABLED:-false}"
      MCP_AUTH_TOKEN: ""
      MCP_DEFAULT_CWD: "/shared"
    volumes:
      - type: bind
        source: ../shared
        target: /shared
      - type: volume
        source: project-moon-local-state
        target: /var/lib/project-moon
    stop_grace_period: 30s

volumes:
  project-moon-local-state:
