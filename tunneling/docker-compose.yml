services:
  workmachine:
    build:
      context: ..
      dockerfile: tunneling/Dockerfile
      args:
        TIMEZONE: "${TZ:-UTC}"
    image: "${WORKMACHINE_IMAGE:-workmachine:local}"
    container_name: workmachine
    hostname: workmachine
    restart: unless-stopped
    ports:
      - "127.0.0.1:2999:2999"
    environment:
      TZ: "${TZ:-UTC}"
      MCP_WORKFLOW_MODE: "${MCP_WORKFLOW_MODE:-auto}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:?Set MCP_PUBLIC_URL in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_OAUTH_ENABLED: "${MCP_OAUTH_ENABLED:-true}"
      MCP_OAUTH_APPROVAL_KEY: "${MCP_OAUTH_APPROVAL_KEY:-}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
    volumes:
      - type: bind
        source: "${SHARED_PATH:?Set SHARED_PATH in .env}"
        target: /shared
      - type: volume
        source: project-moon-state
        target: /var/lib/project-moon
    stop_grace_period: 30s

volumes:
  project-moon-state:
